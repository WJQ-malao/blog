<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订阅我的博客 · WJQ Blog</title>
<meta name="description" content="通过 RSS 订阅吴锦渠的技术博客">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<script>document.documentElement.dataset.theme = localStorage.getItem('site-theme') || 'purple';</script>
<link rel="stylesheet" href="/css/themes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text-soft);
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.7;
    transition: background .3s, color .3s;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: var(--glow1); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: var(--glow2); bottom: -140px; left: -100px; }

  nav {
    position: relative;
    z-index: 2;
    width: min(880px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent2); }
  .brand span {
    font-size: 17px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: var(--text-dim); text-decoration: none; font-size: 15px; transition: color .2s; }
  .nav-links a:hover { color: var(--accent2); }

  .container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(720px, calc(100% - 48px));
    margin: 0 auto;
    padding: 48px 0 56px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 36px 40px;
  }
  h1 { font-size: 30px; margin-bottom: 18px; color: var(--text); }
  p { color: var(--text-dim); margin: .9em 0; font-size: 15.5px; }

  .feed-box {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 22px 0;
    flex-wrap: wrap;
  }
  .feed-url {
    flex: 1;
    min-width: 240px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    color: var(--code-text);
    background: var(--code-bg);
    border: 1px solid var(--accent2);
    border-radius: 10px;
    padding: 12px 16px;
    word-break: break-all;
  }
  .copy-btn {
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 24px var(--shadow);
    transition: transform .2s, box-shadow .2s;
  }
  .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--shadow); }

  .steps { margin-top: 26px; }
  .steps h2 { font-size: 19px; color: var(--text); margin: 22px 0 10px; }
  .steps ol { padding-left: 1.5em; color: var(--text-dim); font-size: 15px; }
  .steps li { margin: .5em 0; }
  .readers { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .reader-tag {
    font-size: 13.5px;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    border-radius: 999px;
    padding: 6px 16px;
  }
  .back-link {
    display: inline-block;
    margin-top: 30px;
    color: var(--accent2);
    text-decoration: none;
    font-size: 15px;
  }
  .back-link:hover { color: var(--accent); }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--text-faint);
  }
  @media (max-width: 760px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a { font-size: 13.5px; }
    .card { padding: 26px 22px; }
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/" data-zh="首页" data-en="Home">首页</a>
    <a href="/blog/" data-zh="博客" data-en="Blog">博客</a>
    <a href="/archives/" data-zh="归档" data-en="Archives">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/" title="RSS 订阅">RSS</a>
    <a href="/game/" title="小游戏">GAME</a>
    <a href="javascript:;" class="settings-toggle" data-zh="设置" data-en="Settings">设置</a>
    <a href="javascript:;" class="lang-toggle">English</a>
  </div>
</nav>

<main class="container">
  <div class="card">
    <h1 data-zh="📡 订阅我的博客" data-en="📡 Subscribe to My Blog">📡 订阅我的博客</h1>
    <p data-zh="本站支持 RSS 订阅。把下面的订阅地址添加到你喜欢的 RSS 阅读器中，每当我发布新文章，你都会第一时间收到。" data-en="This site supports RSS. Add the feed address below to your favorite RSS reader, and you'll get my new posts as soon as they're published.">本站支持 RSS 订阅。把下面的订阅地址添加到你喜欢的 RSS 阅读器中，每当我发布新文章，你都会第一时间收到。</p>

    <div class="feed-box">
      <div class="feed-url" id="feedUrl">https://wjqblog.cn/atom.xml</div>
      <button class="copy-btn" id="copyBtn" onclick="copyFeed()" data-zh="复制订阅地址" data-en="Copy Feed URL">复制订阅地址</button>
    </div>

    <div class="steps">
      <h2 data-zh="如何订阅？" data-en="How to subscribe?">如何订阅？</h2>
      <ol>
        <li data-zh="安装一个 RSS 阅读器（任选其一，均免费）" data-en="Install an RSS reader (any of them, all free)">安装一个 RSS 阅读器（任选其一，均免费）</li>
        <li data-zh="在阅读器中找到「添加订阅源 / Add Feed」" data-en="Find 'Add Feed' in your reader">在阅读器中找到「添加订阅源 / Add Feed」</li>
        <li data-zh="粘贴上面的订阅地址，确认添加" data-en="Paste the feed address above and confirm">粘贴上面的订阅地址，确认添加</li>
        <li data-zh="完成！新文章会自动出现在你的阅读器里" data-en="Done! New posts will show up in your reader automatically">完成！新文章会自动出现在你的阅读器里</li>
      </ol>
      <h2 data-zh="推荐的阅读器" data-en="Recommended readers">推荐的阅读器</h2>
      <div class="readers">
        <span class="reader-tag">Follow</span>
        <span class="reader-tag">Feedly</span>
        <span class="reader-tag">Inoreader</span>
        <span class="reader-tag">irreader</span>
      </div>
    </div>

    <a class="back-link" href="/blog/" data-zh="← 返回博客" data-en="← Back to Blog">← 返回博客</a>
  </div>
</main>

<script src="/js/lang.js"></script>
<script src="/js/settings.js"></script>
<script>
function copyFeed() {
  var url = document.getElementById('feedUrl').textContent.trim();
  var btn = document.getElementById('copyBtn');
  var isEn = localStorage.getItem('site-lang') === 'en';
  function done() {
    btn.textContent = isEn ? 'Copied ✓' : '已复制 ✓';
    setTimeout(function () { btn.textContent = isEn ? 'Copy Feed URL' : '复制订阅地址'; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done);
  } else {
    var ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }
}
</script>

</body>
</html>
