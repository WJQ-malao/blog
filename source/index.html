<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WJQ Blog</title>
<meta name="description" content="吴锦渠的个人主页与技术博客">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8e6f0;
    background: linear-gradient(135deg, #150829 0%, #241040 45%, #31135c 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  /* 背景光斑 */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: rgba(124, 77, 255, .28); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: rgba(0, 229, 255, .14); bottom: -140px; left: -100px; }

  /* 顶部导航 */
  nav {
    position: relative;
    z-index: 2;
    width: min(1080px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(167, 139, 250, .6); }
  .brand span {
    font-size: 17px; font-weight: 700;
    background: linear-gradient(90deg, #c4b5fd, #8b5cf6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    color: #b8b3cc; text-decoration: none; font-size: 15px;
    transition: color .2s;
  }
  .nav-links a:hover { color: #c4b5fd; }

  /* 主视觉区 */
  .hero {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(1080px, calc(100% - 48px));
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 0;
  }
  .hero-text { max-width: 100%; }
  .typed-title { min-height: 1.2em; }
  .tw-cursor {
    display: inline-block;
    width: .5em;
    height: .95em;
    margin-left: 6px;
    vertical-align: -0.1em;
    background: #a78bfa;
    animation: tw-blink .8s step-end infinite;
  }
  @keyframes tw-blink { 50% { opacity: 0; } }
  .hero-fade {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .hero-fade.show {
    opacity: 1;
    transform: translateY(0);
  }
  .hero-text h1 {
    font-size: clamp(34px, 8vw, 72px);
    line-height: 1.15;
    overflow-wrap: break-word;
    background: linear-gradient(90deg, #c4b5fd, #8b5cf6 55%, #6d28d9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 24px;
  }
  .hero-text p {
    font-size: clamp(17px, 2.2vw, 22px);
    line-height: 1.7;
    color: #cfcadd;
    margin-bottom: 40px;
  }
  .cta {
    display: inline-block;
    padding: 15px 38px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(90deg, #8b5cf6, #7c3aed);
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(139, 92, 246, .45);
    transition: transform .2s, box-shadow .2s;
  }
  .cta:hover { transform: translateY(-3px); box-shadow: 0 12px 38px rgba(139, 92, 246, .6); }

  @media (max-width: 760px) {
    nav {
      padding: 10px 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand img { width: 32px; height: 32px; }
    .nav-links {
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav-links a { font-size: 13.5px; }
    .hero { padding: 40px 0; }
    .hero-text p { margin-bottom: 32px; }
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #7d7696;
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/" data-zh="首页" data-en="Home">首页</a>
    <a href="/blog/" data-zh="博客" data-en="Blog">博客</a>
    <a href="/archives/" data-zh="归档" data-en="Archives">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/" title="RSS 订阅">RSS</a>
    <a href="javascript:;" class="lang-toggle">English</a>
  </div>
</nav>

<main class="hero">
  <div class="hero-text">
    <h1 class="typed-title"><span id="typed" data-zh="欢迎来到我的Blog" data-en="Welcome to My Blog"></span><span class="tw-cursor"></span></h1>
    <p class="hero-fade" data-zh="你好，我是吴锦渠。这里是我的个人空间，<br>记录编程、学习笔记与技术思考。" data-en="Hi, I'm Wu Jinqu. This is my personal space,<br>where I share code, notes and ideas.">你好，我是吴锦渠。这里是我的个人空间，<br>记录编程、学习笔记与技术思考。</p>
    <a class="cta hero-fade" href="/blog/" data-zh="进入我的博客 →" data-en="Read My Blog →">进入我的博客 →</a>
  </div>
</main>

<script src="/js/lang.js"></script>
<script>
(function () {
  var text = (localStorage.getItem('site-lang') === 'en') ? 'Welcome to My Blog' : '欢迎来到我的Blog';
  var el = document.getElementById('typed');
  el.textContent = '';
  var i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(type, 120);
    } else {
      document.querySelectorAll('.hero-fade').forEach(function (e) { e.classList.add('show'); });
    }
  }
  type();
})();
</script>
</body>
</html>
