<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吴锦渠 · 个人主页</title>
<meta name="description" content="吴锦渠的个人主页与技术博客">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #5563c1;
    color: #ffffff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f5f3ee;
    color: #222;
    padding: 0 20px;
    height: 44px;
    flex-shrink: 0;
    border-bottom: 3px solid #222;
  }
  .topbar-left { display: flex; align-items: center; gap: 22px; }
  .logo {
    font-weight: 900;
    font-size: 18px;
    background: #ffd54f;
    border: 2px solid #222;
    border-radius: 6px;
    padding: 1px 9px;
    text-decoration: none;
    color: #222;
  }
  .topbar-nav { display: flex; gap: 20px; }
  .topbar-nav a {
    color: #222;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .topbar-nav a:hover { background: #ffd54f; border-radius: 4px; }
  .clock { font-family: Consolas, monospace; font-weight: 700; font-size: 15px; }

  /* ===== 主区域 ===== */
  main {
    flex: 1;
    position: relative;
    padding: clamp(30px, 7vh, 80px) clamp(24px, 6vw, 80px);
    overflow: hidden;
  }
  .typewriter {
    font-weight: 900;
    font-size: clamp(38px, 7.5vw, 96px);
    line-height: 1.18;
    letter-spacing: 1px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .typewriter .accent { color: #ffd54f; }
  .cursor {
    display: inline-block;
    width: .55em;
    height: 1em;
    background: #fff;
    margin-left: 6px;
    vertical-align: -0.08em;
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 右侧图标栏 ===== */
  .dock {
    position: absolute;
    right: 26px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 5;
  }
  .dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: #fff;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .dock-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px solid #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 3px 3px 0 rgba(0,0,0,.35);
    transition: transform .15s;
  }
  .dock-item:hover .dock-icon { transform: scale(1.12) rotate(-4deg); }
  .dock-label { font-size: 12.5px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,.3); }
  .dock-count { font-size: 11.5px; color: #ffd54f; font-weight: 800; }

  /* ===== 底部状态栏 ===== */
  .bottombar {
    display: flex;
    flex-shrink: 0;
    border-top: 3px solid #222;
    background: #4a57ad;
    font-family: Consolas, "Courier New", monospace;
    font-size: clamp(11px, 1.3vw, 15px);
    font-weight: 700;
  }
  .bottombar .cell {
    padding: 12px 18px;
    border-right: 3px solid #222;
    white-space: nowrap;
    overflow: hidden;
  }
  .bottombar .cell.grow { flex: 1; text-align: center; }
  .bottombar .kw { color: #ffd54f; }
  .bottombar .val { color: #fff; }
  .bottombar .site { color: #ffd54f; letter-spacing: 1px; }

  @media (max-width: 760px) {
    .topbar-nav { gap: 12px; }
    .topbar-nav a { font-size: 12px; }
    .dock { right: 12px; gap: 14px; }
    .dock-icon { width: 42px; height: 42px; font-size: 19px; }
    .bottombar .cell:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="/">WJQ</a>
    <nav class="topbar-nav">
      <a href="/">HOME</a>
      <a href="/blog/">BLOG</a>
      <a href="/archives/">ARCHIVE</a>
      <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">GITEE</a>
      <a href="/subscribe/">RSS</a>
    </nav>
  </div>
  <div class="clock" id="clock">00:00:00</div>
</header>

<!-- 主区域 -->
<main>
  <div class="typewriter"><span id="typed"></span><span class="cursor" id="cursor"></span></div>

  <!-- 右侧图标栏 -->
  <aside class="dock">
    <button class="dock-item" onclick="like(this)" title="点赞">
      <span class="dock-icon" style="background:#ff8fa3">👍</span>
      <span class="dock-label">点赞</span>
      <span class="dock-count" id="likeCount"></span>
    </button>
    <a class="dock-item" href="https://gitee.com/wujiang-j" target="_blank" rel="noopener" title="去 Gitee 留言">
      <span class="dock-icon" style="background:#4dd0e1">💬</span>
      <span class="dock-label">留言</span>
    </a>
    <a class="dock-item" href="/subscribe/" title="RSS 订阅说明">
      <span class="dock-icon" style="background:#ffd54f">💡</span>
      <span class="dock-label">订阅</span>
    </a>
    <a class="dock-item" href="/blog/" title="进入博客">
      <span class="dock-icon" style="background:#b39ddb">📝</span>
      <span class="dock-label">博客</span>
    </a>
  </aside>
</main>

<!-- 底部状态栏 -->
<footer class="bottombar">
  <div class="cell"><span class="kw">const</span> <span class="val">Date = <span id="date"></span></span></div>
  <div class="cell"><span class="kw">const</span> <span class="val">UseTime = <span id="usetime">0.0</span>s</span></div>
  <div class="cell"><span class="kw">const</span> <span class="val">Add = 中国</span></div>
  <div class="cell grow site">WWW.WJQBLOG.CN</div>
  <div class="cell"><span class="val">FREEDOM!</span></div>
</footer>

<script>
// ===== 打字机 =====
var lines = [
  'Hey There',
  "I'm 吴锦渠",
  "( σ'ω')σ #Blog"
];
var typedEl = document.getElementById('typed');
var li = 0, ci = 0;
function type() {
  if (li >= lines.length) return;
  var line = lines[li];
  if (ci < line.length) {
    typedEl.textContent += line[ci++];
    setTimeout(type, 90);
  } else {
    if (li < lines.length - 1) {
      typedEl.textContent += '\n';
      li++; ci = 0;
      setTimeout(type, 400);
    } else {
      li++; // 完成
    }
  }
}
type();

// ===== 时钟 =====
function tick() {
  var d = new Date();
  function p(n) { return String(n).padStart(2, '0'); }
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  document.getElementById('date').textContent = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}
setInterval(tick, 1000);
tick();

// ===== 使用时长 =====
var t0 = Date.now();
setInterval(function () {
  document.getElementById('usetime').textContent = ((Date.now() - t0) / 1000).toFixed(1);
}, 100);

// ===== 点赞（本地计数） =====
var LIKE_KEY = 'site-likes';
var likes = parseInt(localStorage.getItem(LIKE_KEY) || '0', 10);
function renderLikes() {
  document.getElementById('likeCount').textContent = likes > 0 ? '+' + likes : '';
}
function like() {
  likes++;
  localStorage.setItem(LIKE_KEY, String(likes));
  renderLikes();
}
renderLikes();
</script>

</body>
</html>
