<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WJQ Blog</title>
<meta name="description" content="吴锦渠的个人主页与技术博客">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<script>document.documentElement.dataset.theme = localStorage.getItem('site-theme') || 'purple';</script>
<link rel="stylesheet" href="/css/themes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text-soft);
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    transition: background .3s, color .3s;
  }
  /* 背景光斑 */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: var(--glow1); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: var(--glow2); bottom: -140px; left: -100px; }

  /* 顶部导航 */
  nav {
    position: relative;
    z-index: 2;
    width: min(1080px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent2); }
  .brand span {
    font-size: 17px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    color: var(--text-dim); text-decoration: none; font-size: 15px;
    transition: color .2s;
  }
  .nav-links a:hover { color: var(--accent2); }
  .menu-toggle {
    display: block;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    font-family: inherit;
  }
  .menu-toggle:hover { color: var(--accent2); }
/* 溢出项收进 ☰ 下拉面板（全端通用） */
  .nav-links a.nav-overflow { display: none; }
  .nav-overflow-panel {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    right: 16px;
    flex-direction: column;
    gap: 0;
    min-width: 160px;
    padding: 8px;
    background: var(--panel-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    z-index: 60;
  }
  nav.open .nav-overflow-panel { display: flex; }
  .nav-overflow-panel a {
    padding: 9px 12px;
    border-radius: 10px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 15px;
  }
  .nav-overflow-panel a:hover { background: var(--accent-soft); color: var(--accent2); }
  .nav-overflow-panel a.settings-toggle::after { content: ">"; float: right; color: var(--text-faint); }

  /* 主视觉区 */
  .hero {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(1080px, calc(100% - 48px));
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 0;
  }
  .hero-text { max-width: 100%; }
  .typed-title { min-height: 1.2em; }
  .tw-cursor {
    display: inline-block;
    width: .5em;
    height: .95em;
    margin-left: 6px;
    vertical-align: -0.1em;
    background: var(--accent2);
    animation: tw-blink .8s step-end infinite;
  }
  @keyframes tw-blink { 50% { opacity: 0; } }
  .hero-fade {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .hero-fade.show {
    opacity: 1;
    transform: translateY(0);
  }
  .hero-text h1 {
    font-size: clamp(34px, 8vw, 72px);
    line-height: 1.15;
    overflow-wrap: break-word;
    background: linear-gradient(90deg, var(--accent2), var(--accent) 55%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 24px;
  }
  .hero-text p {
    font-size: clamp(17px, 2.2vw, 22px);
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 40px;
  }
  .cta {
    display: inline-block;
    padding: 15px 38px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    background: var(--accent);
    border-radius: 999px;
    box-shadow: 0 8px 30px var(--shadow);
    transition: transform .2s, box-shadow .2s;
  }
  .cta:hover { transform: translateY(-3px); box-shadow: 0 12px 38px var(--shadow); }

  @media (max-width: 760px) {
    nav {
      padding: 10px 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 14px; }
    .hero { padding: 40px 0; }
    .hero-text p { margin-bottom: 32px; }
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--text-faint);
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/" data-zh="首页" data-en="Home">首页</a>
    <a href="/blog/" data-zh="博客" data-en="Blog">博客</a>
    <a href="/archives/" class="nav-overflow" data-zh="归档" data-en="Archives">归档</a>
    <a href="https://gitee.com/wujiang-j" class="nav-overflow" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/" class="nav-overflow" title="RSS 订阅">RSS</a>
    <a href="/game/" title="小游戏">GAME</a>
    <a href="javascript:;" class="settings-toggle nav-overflow" data-zh="设置" data-en="Settings">设置</a>
    <a href="javascript:;" class="lang-toggle">English</a>
  </div>
  <div class="nav-overflow-panel">
    <a href="/archives/" data-zh="归档" data-en="Archives">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/" title="RSS 订阅">RSS</a>
    <a href="javascript:;" class="settings-toggle" data-zh="设置" data-en="Settings">设置</a>
  </div>
  <button class="menu-toggle" aria-label="菜单">☰</button>
</nav>

<main class="hero">
  <div class="hero-text">
    <h1 class="typed-title"><span id="typed" data-zh="欢迎来到我的Blog" data-en="Welcome to My Blog"></span><span class="tw-cursor"></span></h1>
    <p class="hero-fade" data-zh="你好，这里是我的个人空间，<br>记录编程、学习笔记与技术思考。" data-en="Hi, this is my personal space,<br>where I share code, notes and ideas.">你好，这里是我的个人空间，<br>记录编程、学习笔记与技术思考。</p>
    <a class="cta hero-fade" href="/blog/" data-zh="进入我的博客 →" data-en="Read My Blog →">进入我的博客 →</a>
  </div>
</main>

<script src="/js/lang.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
  var text = (localStorage.getItem('site-lang') === 'zh') ? '欢迎来到我的Blog' : 'Welcome to My Blog';
  var el = document.getElementById('typed');
  el.textContent = '';
  var i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(type, 120);
    } else {
      document.querySelectorAll('.hero-fade').forEach(function (e) { e.classList.add('show'); });
    }
  }
  type();
})();
</script>
</body>
</html>
