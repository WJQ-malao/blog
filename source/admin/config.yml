backend:
  name: github
  repo: WJQ-malao/blog
  branch: main
  base_url: https://wjqblog.cn
  auth_endpoint: /auth

media_folder: source/img
public_folder: /img

collections:
  - name: posts
    label: 博客文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: 'HH:mm:ss', format: 'YYYY-MM-DD HH:mm:ss' }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 正文, name: body, widget: markdown }
