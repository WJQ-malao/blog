<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆翻牌 · WJQ Blog</title>
<meta name="description" content="翻牌配对的记忆小游戏">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8e6f0;
    background: linear-gradient(135deg, #150829 0%, #241040 45%, #31135c 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.7;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: rgba(124, 77, 255, .28); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: rgba(0, 229, 255, .14); bottom: -140px; left: -100px; }

  nav {
    position: relative;
    z-index: 2;
    width: min(880px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(167, 139, 250, .6); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: #b8b3cc; text-decoration: none; font-size: 15px; transition: color .2s; }
  .nav-links a:hover { color: #c4b5fd; }

  .container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(880px, calc(100% - 48px));
    margin: 0 auto;
    padding: 40px 0 56px;
  }
  .game-card {
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 28px;
    text-align: center;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #fbcfe8, #ec4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .score-box {
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px;
    padding: 6px 20px;
    font-size: 13px;
    color: #9d96b5;
  }
  .score-box b { display: block; font-size: 20px; color: #f9a8d4; font-family: Consolas, monospace; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(100%, 420px);
    margin: 0 auto;
    user-select: none;
    -webkit-user-select: none;
  }
  .mcard {
    aspect-ratio: 1;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: clamp(26px, 6vw, 40px);
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: transparent;
    transition: transform .25s, background .25s;
    transform: rotateY(0);
  }
  .mcard:hover:not(.flipped):not(.done) { transform: translateY(-3px); }
  .mcard.flipped {
    background: #fdf4ff;
    color: #111;
    transform: rotateY(180deg);
  }
  .mcard.flipped span { transform: rotateY(180deg); }
  .mcard span { display: block; transition: transform .25s; }
  .mcard.done {
    background: #334155;
    color: #4ade80;
    cursor: default;
    opacity: .75;
  }

  .actions { margin-top: 20px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    color: #c4b5fd;
    text-decoration: none;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
  }
  .btn:hover { border-color: rgba(167, 139, 250, .55); box-shadow: 0 6px 20px rgba(139, 92, 246, .25); }

  @media (max-width: 760px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a { font-size: 13.5px; }
    .game-card { padding: 18px; }
  }
  .menu-toggle { display: none; background: none; border: none; color: #b8b3cc; font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1; font-family: inherit; }
  @media (max-width: 760px) {
    .menu-toggle { display: block; }
    .nav-links { display: none; flex-direction: column; width: 100%; gap: 0; padding-top: 8px; }
    nav.open .nav-links { display: flex; }
    .nav-links a { font-size: 15px; padding: 10px 4px; border-top: 1px solid rgba(255,255,255,.10); }
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/blog/">博客</a>
    <a href="/archives/">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/">RSS</a>
    <a href="/game/">GAME</a>
  </div>
  <button class="menu-toggle" aria-label="菜单">☰</button>
</nav>

<main class="container">
  <div class="game-card">
    <h1>🃏 记忆翻牌</h1>
    <div class="hud">
      <div class="score-box">步数<b id="moves">0</b></div>
      <div class="score-box">用时<b id="timer">0s</b></div>
      <div class="score-box">最佳<b id="best">-</b></div>
    </div>
    <div class="board" id="board"></div>
    <div class="actions">
      <button class="btn" onclick="newGame()">新游戏</button>
      <a class="btn" href="/game/">← 返回 GAME 主页</a>
    </div>
  </div>
</main>

<script>
(function () {
  var ICONS = ['🦕', '🐍', '🐦', '🍎', '⚡', '🌙', '🔥', '🎈'];
  var deck, first, lock, matched, moves, seconds, timerId, started;
  var boardEl = document.getElementById('board');

  var bestMoves = parseInt(localStorage.getItem('memory-best') || '0', 10);
  if (bestMoves > 0) document.getElementById('best').textContent = bestMoves;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function newGame() {
    deck = shuffle(ICONS.concat(ICONS));
    first = null; lock = false; matched = 0; moves = 0; seconds = 0; started = false;
    clearInterval(timerId);
    document.getElementById('moves').textContent = '0';
    document.getElementById('timer').textContent = '0s';
    boardEl.innerHTML = '';
    deck.forEach(function (icon, i) {
      var b = document.createElement('button');
      b.className = 'mcard';
      b.dataset.icon = icon;
      b.innerHTML = '<span>' + icon + '</span>';
      b.addEventListener('click', function () { flip(b); });
      boardEl.appendChild(b);
    });
  }
  window.newGame = newGame;

  function startTimer() {
    timerId = setInterval(function () {
      seconds++;
      document.getElementById('timer').textContent = seconds + 's';
    }, 1000);
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('done')) return;
    if (!started) { started = true; startTimer(); }
    card.classList.add('flipped');

    if (!first) { first = card; return; }

    moves++;
    document.getElementById('moves').textContent = moves;

    if (first.dataset.icon === card.dataset.icon) {
      first.classList.add('done');
      card.classList.add('done');
      first = null;
      matched += 2;
      if (matched === deck.length) {
        clearInterval(timerId);
        if (!bestMoves || moves < bestMoves) {
          bestMoves = moves;
          localStorage.setItem('memory-best', String(bestMoves));
          document.getElementById('best').textContent = bestMoves;
        }
        setTimeout(function () { alert('🎉 全部配对成功！用了 ' + moves + ' 步 / ' + seconds + ' 秒'); }, 300);
      }
    } else {
      lock = true;
      var f = first;
      setTimeout(function () {
        f.classList.remove('flipped');
        card.classList.remove('flipped');
        first = null;
        lock = false;
      }, 750);
    }
  }

  newGame();
})();
</script>

<script src="/js/nav.js"></script>
</body>
</html>
