<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · WJQ Blog</title>
<meta name="description" content="数字合成益智游戏 2048">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8e6f0;
    background: linear-gradient(135deg, #150829 0%, #241040 45%, #31135c 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.7;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: rgba(124, 77, 255, .28); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: rgba(0, 229, 255, .14); bottom: -140px; left: -100px; }

  nav {
    position: relative;
    z-index: 2;
    width: min(880px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(167, 139, 250, .6); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: #b8b3cc; text-decoration: none; font-size: 15px; transition: color .2s; }
  .nav-links a:hover { color: #c4b5fd; }

  .container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(880px, calc(100% - 48px));
    margin: 0 auto;
    padding: 40px 0 56px;
  }
  .game-card {
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 28px;
    text-align: center;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ffe082, #ffb300);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .scorebar {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .score-box {
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px;
    padding: 6px 20px;
    font-size: 13px;
    color: #9d96b5;
  }
  .score-box b { display: block; font-size: 20px; color: #ffd54f; font-family: Consolas, monospace; }

  .board {
    position: relative;
    width: min(100%, 440px);
    aspect-ratio: 1;
    margin: 0 auto;
    background: #1a0f2e;
    border: 1px solid rgba(167, 139, 250, .25);
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .cell {
    background: rgba(255, 255, 255, .05);
    border-radius: 10px;
  }
  .tile {
    position: absolute;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    transition: top .12s ease, left .12s ease;
    animation: pop .15s ease;
  }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }

  .tip { font-size: 14px; color: #9d96b5; margin: 16px 0 0; }
  .actions { margin-top: 18px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    color: #c4b5fd;
    text-decoration: none;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
  }
  .btn:hover { border-color: rgba(167, 139, 250, .55); box-shadow: 0 6px 20px rgba(139, 92, 246, .25); }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(21, 8, 41, .85);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .overlay h2 { font-size: 30px; color: #ffd54f; }
  .overlay p { font-size: 15px; color: #cfcadd; }

  @media (max-width: 760px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a { font-size: 13.5px; }
    .game-card { padding: 18px; }
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/blog/">博客</a>
    <a href="/archives/">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/">RSS</a>
    <a href="/game/">GAME</a>
  </div>
</nav>

<main class="container">
  <div class="game-card">
    <h1>🔢 2048</h1>
    <div class="scorebar">
      <div class="score-box">得分<b id="score">0</b></div>
      <div class="score-box">最高<b id="best">0</b></div>
    </div>
    <div class="board" id="board">
      <!-- 背景格子 -->
    </div>
    <p class="tip">方向键 / WASD / 滑动屏幕，合成 2048！</p>
    <div class="actions">
      <button class="btn" onclick="newGame()">新游戏</button>
      <a class="btn" href="/game/">← 返回 GAME 主页</a>
    </div>
  </div>
</main>

<script>
(function () {
  var SIZE = 4;
  var board, score, best, won, over;
  var boardEl = document.getElementById('board');
  best = parseInt(localStorage.getItem('g2048-best') || '0', 10);
  document.getElementById('best').textContent = best;

  var COLORS = {
    2:    ['#3a2a5e', '#e8e6f0'],
    4:    ['#4a3573', '#e8e6f0'],
    8:    ['#6d4fa8', '#ffffff'],
    16:   ['#8b5cf6', '#ffffff'],
    32:   ['#a78bfa', '#1a0f2e'],
    64:   ['#c4b5fd', '#1a0f2e'],
    128:  ['#ffe082', '#1a0f2e'],
    256:  ['#ffd54f', '#1a0f2e'],
    512:  ['#ffca28', '#1a0f2e'],
    1024: ['#ffb300', '#1a0f2e'],
    2048: ['#ff8f00', '#ffffff']
  };
  function tileColor(v) { return COLORS[v] || ['#ff6f00', '#ffffff']; }

  // 建背景格子
  for (var i = 0; i < SIZE * SIZE; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    boardEl.appendChild(c);
  }

  function newGame() {
    board = [];
    for (var r = 0; r < SIZE; r++) board.push([0, 0, 0, 0]);
    score = 0; won = false; over = false;
    addTile(); addTile();
    render();
  }
  window.newGame = newGame;

  function addTile() {
    var empty = [];
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++)
      if (board[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    var p = empty[Math.floor(Math.random() * empty.length)];
    board[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function slide(row) {
    var arr = row.filter(function (v) { return v !== 0; });
    var gained = 0;
    for (var i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        gained += arr[i];
        if (arr[i] === 2048) won = true;
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return { row: arr, gained: gained };
  }

  function rotate(b) {
    var n = [];
    for (var r = 0; r < SIZE; r++) {
      n.push([]);
      for (var c = 0; c < SIZE; c++) n[r].push(b[c][SIZE - 1 - r]);
    }
    return n;
  }

  function move(times) {
    if (over) return;
    var b = board;
    for (var i = 0; i < times; i++) b = rotate(b);
    var moved = false, gained = 0;
    var nb = b.map(function (row) {
      var res = slide(row);
      gained += res.gained;
      if (res.row.join() !== row.join()) moved = true;
      return res.row;
    });
    for (var j = 0; j < (4 - times) % 4; j++) nb = rotate(nb);
    if (!moved) return;
    board = nb;
    score += gained;
    if (score > best) { best = score; localStorage.setItem('g2048-best', String(best)); }
    addTile();
    render();
    if (won) showOverlay('🎉 你赢了！', '合成 2048，还要继续吗？', true);
    else if (isOver()) { over = true; showOverlay('GAME OVER', '得分 ' + score, false); }
  }

  function isOver() {
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return false;
      if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
      if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
    }
    return true;
  }

  function render() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    boardEl.querySelectorAll('.tile, .overlay').forEach(function (t) { t.remove(); });
    var rect = boardEl.getBoundingClientRect();
    var pad = 10, gap = 10;
    var cell = (rect.width - pad * 2 - gap * (SIZE - 1)) / SIZE;
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var v = board[r][c];
      if (!v) continue;
      var t = document.createElement('div');
      t.className = 'tile';
      var col = tileColor(v);
      t.style.background = col[0];
      t.style.color = col[1];
      t.style.width = cell + 'px';
      t.style.height = cell + 'px';
      t.style.left = (pad + c * (cell + gap)) + 'px';
      t.style.top = (pad + r * (cell + gap)) + 'px';
      t.style.fontSize = (v >= 1000 ? cell * 0.32 : v >= 100 ? cell * 0.38 : cell * 0.44) + 'px';
      t.textContent = v;
      boardEl.appendChild(t);
    }
  }

  function showOverlay(title, sub, isWin) {
    var o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML = '<h2>' + title + '</h2><p>' + sub + '</p>' +
      (isWin ? '<button class="btn" onclick="this.parentElement.remove()">继续挑战</button>' : '<button class="btn" onclick="newGame()">再来一局</button>');
    boardEl.appendChild(o);
  }

  document.addEventListener('keydown', function (e) {
    var k = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(k) >= 0) e.preventDefault();
    if (k === 'ArrowUp' || k === 'KeyW') move(3);
    else if (k === 'ArrowDown' || k === 'KeyS') move(1);
    else if (k === 'ArrowLeft' || k === 'KeyA') move(0);
    else if (k === 'ArrowRight' || k === 'KeyD') move(2);
  });

  // 触屏滑动
  var tx = 0, ty = 0;
  boardEl.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  boardEl.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 1 : 3);
  });

  window.addEventListener('resize', render);
  newGame();
})();
</script>

</body>
</html>
