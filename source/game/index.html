<script>document.documentElement.dataset.theme = localStorage.getItem('site-theme') || 'purple';</script>
<link rel="stylesheet" href="/css/themes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text-soft);
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.7;
    transition: background .3s, color .3s;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: var(--glow1); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: var(--glow2); bottom: -140px; left: -100px; }

  nav {
    position: relative;
    z-index: 2;
    width: min(880px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent2); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: var(--text-dim); text-decoration: none; font-size: 15px; transition: color .2s; }
  .nav-links a:hover { color: var(--accent2); }

  .container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(880px, calc(100% - 48px));
    margin: 0 auto;
    padding: 40px 0 56px;
  }
  .game-list { display: flex; flex-direction: column; gap: 20px; }
  .game-card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .game-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent2);
    box-shadow: 0 10px 34px var(--shadow);
  }
  .game-name {
    padding: 18px 26px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
  }
  .game-banner {
    height: 130px;
    background: #ffd54f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }

  @media (max-width: 760px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a { font-size: 13.5px; }
  }
</style>
</head>
