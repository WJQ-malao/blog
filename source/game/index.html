<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME · WJQ Blog</title>
<meta name="description" content="吴锦渠的小游戏合集">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8e6f0;
    background: linear-gradient(135deg, #150829 0%, #241040 45%, #31135c 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.7;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: rgba(124, 77, 255, .28); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: rgba(0, 229, 255, .14); bottom: -140px; left: -100px; }

  nav {
    position: relative;
    z-index: 2;
    width: min(880px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(167, 139, 250, .6); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: #b8b3cc; text-decoration: none; font-size: 15px; transition: color .2s; }
  .nav-links a:hover { color: #c4b5fd; }

  .container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(880px, calc(100% - 48px));
    margin: 0 auto;
    padding: 40px 0 56px;
  }
  .page-title {
    font-size: 30px;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #e9e4fb, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .game-list { display: flex; flex-direction: column; gap: 20px; }
  .game-card {
    display: block;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .game-card:hover {
    transform: translateY(-3px);
    border-color: rgba(167, 139, 250, .55);
    box-shadow: 0 10px 34px rgba(139, 92, 246, .25);
  }
  .game-banner {
    height: 130px;
    background: #ffd54f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }
  .game-info { padding: 20px 26px; }
  .game-info h2 { font-size: 20px; color: #fff; margin-bottom: 6px; }
  .game-info p { font-size: 14px; color: #b8b3cc; }

  @media (max-width: 760px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a { font-size: 13.5px; }
    .page-title { font-size: 24px; }
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/blog/">博客</a>
    <a href="/archives/">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/">RSS</a>
    <a href="/game/">GAME</a>
  </div>
</nav>

<main class="container">
  <h1 class="page-title">🎮 小游戏</h1>
  <div class="game-list">
    <a class="game-card" href="/game/dino/">
      <div class="game-banner">🦕</div>
      <div class="game-info">
        <h2>恐龙跑酷</h2>
        <p>Chrome 断网小恐龙复刻版。按空格或点击跳跃，躲开仙人掌和翼龙，挑战最高分！</p>
      </div>
    </a>
  </div>
</main>

</body>
</html>
