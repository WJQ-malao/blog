<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME · WJQ Blog</title>
<meta name="description" content="吴锦渠的小游戏合集">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8e6f0;
    background: linear-gradient(135deg, #150829 0%, #241040 45%, #31135c 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.7;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 480px; height: 480px; background: rgba(124, 77, 255, .28); top: -120px; right: -80px; }
  body::after  { width: 420px; height: 420px; background: rgba(0, 229, 255, .14); bottom: -140px; left: -100px; }

  nav {
    position: relative;
    z-index: 2;
    width: min(880px, calc(100% - 48px));
    margin: 22px auto 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(167, 139, 250, .6); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: #b8b3cc; text-decoration: none; font-size: 15px; transition: color .2s; }
  .nav-links a:hover { color: #c4b5fd; }

  .container {
    position: relative;
    z-index: 1;
    flex: 1;
    width: min(880px, calc(100% - 48px));
    margin: 0 auto;
    padding: 40px 0 56px;
  }
  .page-title {
    font-size: 30px;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #e9e4fb, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .game-list { display: flex; flex-direction: column; gap: 20px; }
  .game-card {
    display: block;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .game-card:hover {
    transform: translateY(-3px);
    border-color: rgba(167, 139, 250, .55);
    box-shadow: 0 10px 34px rgba(139, 92, 246, .25);
  }
  .game-name {
    padding: 18px 26px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-align: center;
  }
  .game-banner {
    height: 130px;
    background: #ffd54f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }

  @media (max-width: 760px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
    .brand img { width: 32px; height: 32px; }
    .nav-links { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a { font-size: 13.5px; }
    .page-title { font-size: 24px; }
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">
    <img src="/img/avatar.jpg" alt="头像">
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/blog/">博客</a>
    <a href="/archives/">归档</a>
    <a href="https://gitee.com/wujiang-j" target="_blank" rel="noopener">Gitee</a>
    <a href="/subscribe/">RSS</a>
    <a href="/game/">GAME</a>
  </div>
</nav>

<main class="container">
  <div class="game-list">
    <a class="game-card" href="/game/dino/">
      <div class="game-name">恐龙跑酷</div>
      <div class="game-banner"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="132" height="120" fill="#111111"><rect x="140" y="0" width="60" height="10"/><rect x="140" y="10" width="80" height="10"/><rect x="140" y="20" width="20" height="10"/><rect x="170" y="20" width="50" height="10"/><rect x="140" y="30" width="80" height="10"/><rect x="140" y="40" width="80" height="10"/><rect x="140" y="50" width="50" height="10"/><rect x="140" y="60" width="70" height="10"/><rect x="0" y="70" width="10" height="10"/><rect x="110" y="70" width="50" height="10"/><rect x="0" y="80" width="20" height="10"/><rect x="110" y="80" width="60" height="10"/><rect x="0" y="90" width="30" height="10"/><rect x="110" y="90" width="60" height="10"/><rect x="0" y="100" width="40" height="10"/><rect x="100" y="100" width="80" height="10"/><rect x="0" y="110" width="170" height="10"/><rect x="10" y="120" width="160" height="10"/><rect x="20" y="130" width="140" height="10"/><rect x="30" y="140" width="110" height="10"/><rect x="40" y="150" width="80" height="10"/><rect x="40" y="160" width="60" height="10"/><rect x="40" y="170" width="20" height="10"/><rect x="80" y="170" width="20" height="10"/><rect x="40" y="180" width="10" height="10"/><rect x="90" y="180" width="10" height="10"/><rect x="40" y="190" width="20" height="10"/><rect x="100" y="190" width="20" height="10"/></svg></div>
    </a>
  </div>
</main>

</body>
</html>
