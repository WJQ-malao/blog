<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="url(#neon)" stroke-width="3"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.35" stroke-dasharray="6 5"/>
  <text x="100" y="118" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="bold" fill="url(#neon)" filter="url(#glow)">WJQ</text>
  <text x="100" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#00e5ff" opacity="0.7" letter-spacing="3">&lt;/&gt;</text>
</svg>
